name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [18, 20, 22, 24]
        include:
          - os: windows-latest
            node: 22
          - os: macos-latest
            node: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Vérifier la syntaxe
        run: node --check public/app.js && node --check public/worlds.js && node --check bin/cli.js && node --check tui/index.js
      - name: Audit des dépendances
        run: npm audit --omit=dev --audit-level=high
      - name: Le CLI démarre
        run: node bin/cli.js --version
